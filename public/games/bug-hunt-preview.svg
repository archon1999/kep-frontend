        <text x="122" y="174">1</text><text x="122" y="230">2</text><text x="122" y="286">3</text><text x="122" y="342">4</text><text x="122" y="398">5</text><text x="122" y="454">6</text>
      </g>
      <text x="178" y="174"><tspan fill="#77B2FF">const</tspan><tspan fill="#D9EAF2"> numbers </tspan><tspan fill="#84C9DA">=</tspan><tspan fill="#D9EAF2"> [</tspan><tspan fill="#F7C078">10</tspan><tspan fill="#D9EAF2">, </tspan><tspan fill="#F7C078">20</tspan><tspan fill="#D9EAF2">, </tspan><tspan fill="#F7C078">30</tspan><tspan fill="#D9EAF2">, </tspan><tspan fill="#F7C078">40</tspan><tspan fill="#D9EAF2">];</tspan></text>
      <text x="178" y="230"><tspan fill="#77B2FF">const</tspan><tspan fill="#D9EAF2"> firstTwo </tspan><tspan fill="#84C9DA">=</tspan></text>
      <text x="226" y="286"><tspan fill="#D9EAF2">numbers.</tspan><tspan fill="#77D8C5">slice</tspan><tspan fill="#D9EAF2">(</tspan><tspan fill="#F7C078">0</tspan><tspan fill="#D9EAF2">, </tspan><tspan fill="#FFB67B">1</tspan><tspan fill="#D9EAF2">);</tspan></text>
      <text x="178" y="342"><tspan fill="#77B2FF">if</tspan><tspan fill="#D9EAF2"> (firstTwo.length </tspan><tspan fill="#84C9DA">===</tspan><tspan fill="#F7C078"> 2</tspan><tspan fill="#D9EAF2">) {</tspan></text>
      <text x="226" y="398"><tspan fill="#D9EAF2">return</tspan><tspan fill="#B0DBD5"> firstTwo</tspan><tspan fill="#D9EAF2">;</tspan></text>
