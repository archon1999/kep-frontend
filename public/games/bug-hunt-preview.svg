      <stop offset=".52" stop-color="#CBEAF2"/>
      <stop offset="1" stop-color="#B5D6EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(338 0 0 260 760 18)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82E8EC" stop-opacity=".62"/>
      <stop offset="1" stop-color="#82E8EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="editor" x1="0" y1="0" x2="1" y2="1">
