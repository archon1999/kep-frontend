name: Frontend CI/CD

on:
  pull_request:
    branches:
      - production
  push:
    branches:
      - production

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify deployment transport and rollback
        run: |
          bash -n ops/ci-deploy-production.sh ops/deploy-production.sh
          bash ops/tests/test-deployment.sh

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Native TypeScript test discovery uses --experimental-strip-types,
          # which is unavailable on Node 20.
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 600000
          npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Verify bundle budgets and lazy loading
        run: |
          npm run check:bundle
          npm run test:lazy-loading

      - name: Verify SEO documents
        run: npm run check:seo

      - name: Verify production Nginx routes and static assets
        run: |
          docker build --tag kep-frontend-ci .
          docker run --detach --name kep-frontend-route-check kep-frontend-ci
          trap 'docker rm --force kep-frontend-route-check' EXIT
          docker exec kep-frontend-route-check nginx -t
          docker exec -i kep-frontend-route-check sh -s < docker/test-routes.sh

      - name: Upload production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v7

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist

      - name: Deploy verified build over pinned OpenSSH
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USERNAME }}
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_FINGERPRINT: ${{ secrets.HOST_FINGERPRINT }}
          DEPLOY_PORT: ${{ secrets.PORT }}
        run: bash ops/ci-deploy-production.sh "${{ github.sha }}" frontend-dist
