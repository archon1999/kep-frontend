# Query pages are rendered by React and must not inherit a list's page-one canonical.
map $args $route_document {
    "" $uri/index.html;
    default /app.html;
}

map $request_uri $robots_header {
    default "";
    ~^/(admin|settings|login|teams)(/|\?|$) "noindex, follow";
    ~^/(403|404)(\?|$) "noindex, follow";
    ~^/problems/(attempts|user-statistics)(/|$) "noindex, follow";
    ~^/tests/test-pass/ "noindex, follow";
    ~^/blog/(new|[^/]+/edit)$ "noindex, follow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        try_files $route_document $uri /app.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag $robots_header always;
    }

    location ~ \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag $robots_header always;
    }

    location = /404 {
        error_page 404 /404.html;
        return 404;
    }

    # Only content-hashed Vite files can safely be cached for a year.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|woff2?|png|webp|jpe?g|svg)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(woff2?|ttf|png|webp|jpe?g|gif|svg|ico|avif|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(js|css|map|json|xml|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

