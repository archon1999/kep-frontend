server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        # Static directories can share names with React routes (for example /games).
        # Only serve files; let the SPA handle directory and deep-link requests.
        try_files $uri /index.html;
    }

    location = /index.html {
        # Route documents must discover the current release's hashed assets.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

