    <script>
      window.__kepSplashStartedAt = Date.now();

      (function () {
        var defaultPrimaryColor = '#3d7cf4';
        var darkPresets = ['default-dark', 'dracula', 'midnight', 'ember'];
        var presetColors = {
          'default-light': '#3d7cf4',
          'default-dark': '#63a6ff',
          luxury: '#c4a15a',
          retro: '#ef6f6c',
          arctic: '#2aa7c9',
          nature: '#28a66a',
          ember: '#f97316',
          dracula: '#bd93f9',
          midnight: '#7dd3fc',
        };

        var readValue = function (key, fallback) {
          try {
            var value = localStorage.getItem(key);
            if (value === null) return fallback;

            try {
              return JSON.parse(value);
            } catch (error) {
              return value;
            }
          } catch (error) {
            return fallback;
          }
        };

        var storedMode = readValue('kep-mode', 'system');
        var themePreset = readValue('themePreset', 'default-light');
        var primaryColor = readValue(
          'primaryColor',
          presetColors[themePreset] || defaultPrimaryColor,
        );
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolvedMode = storedMode === 'system' ? (prefersDark ? 'dark' : 'light') : storedMode;

        if (storedMode !== 'dark' && storedMode !== 'light' && storedMode !== 'system') {
          resolvedMode = darkPresets.indexOf(themePreset) >= 0 ? 'dark' : 'light';
        }

        document.documentElement.setAttribute('data-kep-color-scheme', resolvedMode);
        document.documentElement.setAttribute('data-kep-preload-mode', resolvedMode);
        document.documentElement.style.setProperty(
          '--kep-splash-primary',
          typeof primaryColor === 'string' && primaryColor ? primaryColor : defaultPrimaryColor,
        );
      })();
    </script>

      #loading-bg {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        overflow: hidden !important;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 50% 44%,
            color-mix(in srgb, var(--kep-splash-primary) 16%, transparent),
            transparent 32%
          ),
          #f8fbff;
        opacity: 1;
        transition:
          opacity 360ms ease,
          visibility 360ms ease;
      }

      html[data-kep-preload-mode='dark'] #loading-bg {
        background:
          radial-gradient(
            circle at 50% 44%,
            color-mix(in srgb, var(--kep-splash-primary) 20%, transparent),
            transparent 34%
          ),
          #0f1014;
      }

      #loading-bg.kep-splash-hidden {
        visibility: hidden;
        opacity: 0;
      }

      #loading-bg svg {
        width: 128px;
        height: 128px;
        filter: drop-shadow(
          0 24px 60px color-mix(in srgb, var(--kep-splash-primary) 30%, transparent)
        );
      }

      @keyframes animate-svg-fill-primary {
        0% {

        100% {

        }
      }

      @keyframes animate-svg-fill-accent {
        0% {

        }

        100% {
          fill: color-mix(in srgb, var(--kep-splash-primary) 28%, #ab2a2a);
        }
      }

      .svg-elem-1 {

      }

      .svg-elem-2 {

      }

      .svg-elem-6 {

      }

      .svg-elem-7 {

      }
